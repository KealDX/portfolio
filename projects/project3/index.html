<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Simple Project Manager</h1>
        <!-- For task form-->

        <div class="add-task">
            <div class="form-row">
                <input type="text" id="taskTitle" placeholder="Task Title" required>
                <select id="taskPriority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button onclick="addTask()">Add Task</button>
            </div>
        </div>

        <div class="boards">
            <div class="board" data-status="todo">
                <div class="board-title">To Do</div>
                <div class="tasks" id="todoTasks"></div>
            </div>
            <div class="board" data-status="doing">
                <div class="board-title">Doing</div>
                <div class="tasks" id="doingTasks"></div>
            </div>
            <div class="board" data-status="done">
                <div class="board-title">Done</div>
                <div class="tasks" id="doneTasks"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
